<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Báo cáo doanh thu - LEO SUSHI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #d4af37;
            --dark-bg: #090909;
            --card-bg: #161616;
        }
        body {
            background-color: var(--dark-bg);
            color: #fff;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }
        .text-gold { color: var(--gold) !important; }
        
        /* Password Gate */
        #unlockGate {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            padding: 20px;
            text-align: center;
        }
        .lock-icon { font-size: 60px; margin-bottom: 20px; filter: drop-shadow(0 0 15px rgba(212,175,55,0.4)); }
        .pass-input {
            background: #1a1a1a;
            border: 1px solid rgba(255,255,255,0.1);
            color: #fff;
            border-radius: 15px;
            padding: 15px;
            text-align: center;
            font-size: 20px;
            letter-spacing: 5px;
            max-width: 280px;
            width: 100%;
            margin-bottom: 15px;
        }
        .btn-unlock {
            background: var(--gold);
            color: #000;
            border: none;
            border-radius: 15px;
            padding: 15px;
            font-weight: 900;
            width: 100%;
            max-width: 280px;
            transition: all 0.3s;
        }
        .btn-unlock:active { transform: scale(0.95); opacity: 0.9; }

        /* Dashboard View */
        #dashboardContent { display: none; }
        .top-bar { padding: 20px; background: rgba(229,207,142,0.05); border-bottom: 1px solid rgba(255,255,255,0.05); }
    </style>
</head>
<body>

    <!-- MÀN HÌNH KHOÁ -->
    <div id="unlockGate">
        <div class="lock-icon">🔒</div>
        <h2 class="fw-900 mb-2">Dữ liệu bảo mật</h2>
        <p class="opacity-50 small mb-4">Vui lòng nhập mật mã quản trị để xem báo cáo.</p>
        <input type="password" id="passCode" class="pass-input" placeholder="••••" maxlength="4" autofocus onkeypress="if(event.key==='Enter') verify()">
        <button onclick="verify()" class="btn-unlock">XÁC NHẬN</button>
        <p id="errorMsg" class="text-danger small mt-3" style="display: none;">Mật mã không chính xác!</p>
    </div>

    <!-- MÀN HÌNH CHÍNH -->
    <div id="dashboardContent">
        <div id="statsContent"></div>
    </div>

    <script src="js/admin-stats.js"></script>
    <script>
        const MASTER_PASS = '0301';

        function verify() {
            const input = document.getElementById('passCode');
            const error = document.getElementById('errorMsg');
            
            if (input.value === MASTER_PASS) {
                // Unlock AdminStats internal state too
                if (window.AdminStats) {
                    window.AdminStats.isUnlocked = true;
                    // Force owner role for this standalone page
                    localStorage.setItem('leo_admin_role', 'owner');
                }
                
                document.getElementById('unlockGate').style.display = 'none';
                document.getElementById('dashboardContent').style.display = 'block';
                
                // Initialize Stats
                AdminStats.init();
            } else {
                error.style.display = 'block';
                input.value = '';
                input.focus();
            }
        }
    </script>
</body>
</html>
