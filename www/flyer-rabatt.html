<html lang="de">
<head>

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Inter:wght@300;400;500;600;700;800&family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --flyer-w: 380px;
            --flyer-h: 540px;
            --bg-dark: #080808;
            --bg-card: #0d0d0d;
            --accent-gold: #c5a059;
            --accent-gold-light: #e6d2a7;
            --accent-red: #b31b1b;
            --text-main: #f5f5f0;
            --text-muted: rgba(245, 245, 240, 0.6);
            --border-gold: 1px solid rgba(197, 160, 89, 0.3);
            --gold-gradient: linear-gradient(135deg, #c5a059 0%, #f0e2b6 50%, #8c6a2d 100%);
            --red-gradient: linear-gradient(135deg, #b31b1b 0%, #800000 100%);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #050505;
            color: var(--text-main);
            min-height: 100vh;
        }

        /* ===== Interface ===== */
        .admin-bar {
            background: rgba(13, 13, 13, 0.95);
            backdrop-filter: blur(20px);
            border-bottom: var(--border-gold);
            padding: 15px 30px;
            display: flex;
            align-items: center;
            gap: 20px;
            position: sticky; top: 0; z-index: 1000;
        }

        .admin-bar h1 {
            font-family: 'Playfair Display', serif;
            font-size: 20px;
            color: var(--accent-gold);
            margin-right: auto;
        }

        .control-group { display: flex; align-items: center; gap: 8px; font-size: 13px; }
        .control-group input {
            background: #1a1a1a;
            border: 1px solid #333;
            color: #fff;
            padding: 6px 12px;
            border-radius: 4px;
            outline: none;
        }
        .control-group input:focus { border-color: var(--accent-gold); }

        .btn {
            padding: 8px 20px;
            border: none;
            border-radius: 4px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 1px;
        }
        .btn-gold { background: var(--gold-gradient); color: #000; }
        .btn-red { background: var(--red-gradient); color: #fff; }
        .btn-dark { background: #333; color: #fff; }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.4); opacity: 0.9; }

        /* ===== Preview ===== */
        .workspace {
            padding: 60px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px;
        }

        .side-title {
            font-family: 'Playfair Display', serif;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 5px;
            color: var(--accent-gold);
            margin-bottom: 20px;
            opacity: 0.6;
        }

        .sides-row {
            display: flex;
            gap: 60px;
            flex-wrap: wrap;
            justify-content: center;
        }

        /* ===== FLYER SHARED STYLES ===== */
        .flyer-card {
            width: var(--flyer-w);
            height: var(--flyer-h);
            background: var(--bg-card);
            position: relative;
            overflow: hidden;
            box-shadow: 0 40px 80px rgba(0,0,0,0.8), 0 0 0 1px rgba(197, 160, 89, 0.1);
        }

        /* ========== FRONT DESIGN (COLLAGE) ========== */
        .front {
            display: flex;
            flex-direction: column;
        }

        .collage-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            height: 320px;
            gap: 2px;
            background: var(--accent-gold); /* Thin gold border between images */
            position: relative;
        }

        .collage-item { position: relative; overflow: hidden; }
        .collage-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s;
        }
        .collage-item::after {
            content: '';
            position: absolute; top:0; left:0; right:0; bottom:0;
            background: linear-gradient(to bottom, transparent 40%, rgba(0,0,0,0.4));
        }

        /* Central Badge */
        .badge-center {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 130px;
            height: 130px;
            background: var(--bg-card);
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            border: 2px solid var(--accent-gold);
            box-shadow: 0 0 30px rgba(0,0,0,0.8), inset 0 0 15px rgba(197, 160, 89, 0.2);
        }
        .badge-center::before {
            content: '';
            position: absolute; top: -6px; left: -6px; right: -6px; bottom: -6px;
            border: 1px solid var(--accent-gold);
            border-radius: 50%;
            opacity: 0.4;
        }

        .badge-pct {
            font-family: 'Playfair Display', serif;
            font-size: 42px;
            font-weight: 900;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1;
        }
        .badge-pct span { font-size: 22px; vertical-align: super; margin-left: -2px; }
        .badge-txt {
            font-family: 'Montserrat', sans-serif;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 3px;
            color: var(--text-main);
            margin-top: -2px;
        }

        /* Front Bottom */
        .front-content {
            flex: 1;
            padding: 30px 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            position: relative;
        }
        
        .premium-label {
            font-family: 'Playfair Display', serif;
            font-size: 16px;
            font-weight: 700;
            font-style: italic;
            color: var(--accent-gold-light);
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .discount-banner {
            font-family: 'Montserrat', sans-serif;
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 2px;
            color: #fff;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        .front-sub {
            font-size: 12px;
            color: var(--text-muted);
            line-height: 1.6;
            max-width: 240px;
        }

        .front-divider {
            width: 60px;
            height: 1px;
            background: var(--gold-gradient);
            margin: 20px 0;
            opacity: 0.5;
        }

        .front-footer {
            margin-top: auto;
            display: flex;
            gap: 20px;
            font-family: 'Montserrat', sans-serif;
            font-size: 9px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--accent-gold);
        }

        .logo-box {
            position: absolute;
            top: -25px;
            width: 50px; height: 50px;
            background: #fff;
            border-radius: 8px;
            padding: 5px;
            border: 2px solid var(--accent-gold);
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }
        .logo-box img { width: 100%; height: 100%; object-fit: contain; }

        /* ========== BACK DESIGN ========== */
        .back {
            display: flex;
            flex-direction: column;
            background: radial-gradient(circle at top right, #1a1a1a 0%, #0d0d0d 100%);
        }

        .back-header {
            padding: 40px 30px 20px;
            text-align: center;
        }
        .back-header .logo-large {
            width: 60px; height: 60px;
            margin: 0 auto 20px;
            background: #fff;
            padding: 8px;
            border-radius: 12px;
            border: 2px solid var(--accent-gold);
        }
        .back-header .logo-large img { width: 100%; height: 100%; object-fit: contain; }
        .back-header h2 {
            font-family: 'Playfair Display', serif;
            font-size: 26px;
            font-weight: 800;
            color: #fff;
            letter-spacing: 1px;
        }

        .qr-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .qr-frame {
            background: #fff;
            padding: 12px;
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            position: relative;
        }
        /* Gold corner accents */
        .qr-corner {
            position: absolute;
            width: 30px; height: 30px;
            border: 3px solid var(--accent-gold);
        }
        .tl { top: -8px; left: -8px; border-right: 0; border-bottom: 0; border-radius: 10px 0 0 0; }
        .br { bottom: -8px; right: -8px; border-left: 0; border-top: 0; border-radius: 0 0 10px 0; }

        .scan-label {
            margin-top: 20px;
            font-family: 'Montserrat', sans-serif;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--accent-gold);
        }

        .steps-container {
            padding: 20px 40px 40px;
            background: rgba(0,0,0,0.3);
        }
        .step-item {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 12px;
        }
        .step-num {
            width: 22px; height: 22px;
            border-radius: 50%;
            background: var(--gold-gradient);
            color: #000;
            display: flex; align-items: center; justify-content: center;
            font-size: 11px; font-weight: 900;
        }
        .step-txt {
            font-size: 12px;
            color: var(--text-muted);
            line-height: 1.4;
        }

        .back-footer {
            background: var(--red-gradient);
            padding: 10px;
            text-align: center;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* ===== Print Layout ===== */
        #printArea { display: none; }

        @media print {
            * {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
                color-adjust: exact !important;

            @page {

                margin: 0;

            .admin-bar, .workspace, .side-title { display: none !important; }
            #printArea { display: block !important; }

            .print-page {
                width: 210mm;

                padding: 0;
                display: flex;
                flex-wrap: wrap;
                align-content: flex-start;
                justify-content: flex-start;
                gap: 0;
                page-break-after: always;
                box-sizing: border-box;
                background: #fff !important;

            .print-card {

                border: none;
                box-shadow: none !important;
                display: flex !important;
                flex-direction: column !important;

            .print-card .qr-frame { padding: 3mm !important; border-radius: 10px !important; }

            .print-card .step-txt { font-size: 8pt !important; }
            .print-card .back-footer { padding: 2mm !important; font-size: 8pt !important; }
            
            .print-card .logo-box { width: 12mm !important; height: 12mm !important; top: -6mm !important; border-width: 1.5px !important; }
            .print-card.full-page {

            .print-card.full-page .collage-grid { height: 135mm !important; }
            .print-card.full-page .logo-box { width: 22mm !important; height: 22mm !important; top: -11mm !important; }
            .print-card.full-page .premium-label { font-size: 20pt !important; margin-bottom: 2mm !important; }
            .print-card.full-page .discount-banner { font-size: 34pt !important; margin-bottom: 6mm !important; }
            .print-card.full-page .badge-center { width: 44mm !important; height: 44mm !important; }
            .print-card.full-page .badge-pct { font-size: 52pt !important; }
            
            .print-card.full-page .qr-steps-row { gap: 10mm !important; }
            .print-card.full-page .qr-frame { padding: 4mm !important; border-radius: 12px !important; }
            .print-card.full-page .qr-placeholder { width: 40mm !important; height: 40mm !important; }

            .print-card.full-page .step-txt { font-size: 13pt !important; }

            }

            /* A7 Size (8-up) */
            .print-card.a7-size {

            }

            .print-card.a7-size .v-spacer { height: 3mm !important; }
        }
    </style>

    <!-- Hidden Print Area -->
    <div id="printArea"></div>

    <script>
        function generateQR(containerId, url, size) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            new QRCode(container, {
                text: url,
                width: size || 160,
                height: size || 160,
                colorDark: "#000000",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.H
            });
        }

        function updateDesign() {
            const layoutMode = document.getElementById('layoutMode').value;
            const countInput = document.getElementById('flyerCount');
            
            // Sync count if it's the default for the current mode
            if (layoutMode === '4') countInput.value = 4;
            else if (layoutMode === '8') countInput.value = 8;
            else if (layoutMode === '1') countInput.value = 1;

            const url = document.getElementById('webUrl').value;
            generateQR('qrcode_preview', url, 160);
            renderPrintLayout(url);
        }

        function renderPrintLayout(url) {
            const layoutMode = document.getElementById('layoutMode').value;
            const cardsPerPage = parseInt(layoutMode);
            const isFullPage = layoutMode === '1';
            const isA7 = layoutMode === '8';
            
            // Default count to match cardsPerPage if not specified
            const countInput = document.getElementById('flyerCount');
            const count = isFullPage ? 1 : (parseInt(countInput.value) || cardsPerPage);
            
            const printArea = document.getElementById('printArea');
            printArea.innerHTML = '';
            
            const pages = Math.ceil(count / cardsPerPage);

            // Both Front and Back pages of the paper will have the SAME content
            // First Page (Face A)
            for (let p = 0; p < pages; p++) {
                const page = document.createElement('div');
                page.className = 'print-page' + (isFullPage ? ' full-page' : '') + (isA7 ? ' a7-layout' : '');
                const remaining = Math.min(cardsPerPage, count - (p * cardsPerPage));
                for (let i = 0; i < remaining; i++) {
                    const uniqueId = `qr_print_front_${p}_${i}`;
                    let html = getConsolidatedHTML(uniqueId);
                    if (isFullPage) {
                        html = html.replace('print-card', 'print-card full-page');
                    } else if (isA7) {
                        html = html.replace('print-card', 'print-card a7-size');
                    }
                    page.innerHTML += html;
                }
                printArea.appendChild(page);
            }

            // Second Page (Face B) - Identical for double-sided matching
            for (let p = 0; p < pages; p++) {
                const page = document.createElement('div');
                page.className = 'print-page' + (isFullPage ? ' full-page' : '') + (isA7 ? ' a7-layout' : '');
                const remaining = Math.min(cardsPerPage, count - (p * cardsPerPage));
                for (let i = 0; i < remaining; i++) {
                    const uniqueId = `qr_print_back_${p}_${i}`;
                    let html = getConsolidatedHTML(uniqueId);
                    if (isFullPage) {
                        html = html.replace('print-card', 'print-card full-page');
                    } else if (isA7) {
                        html = html.replace('print-card', 'print-card a7-size');
                    }
                    page.innerHTML += html;
                }
                printArea.appendChild(page);
            }

            // Small delay to generate print QRs
            setTimeout(() => {
                document.querySelectorAll('.qr-placeholder').forEach(el => {
                    let qrSize = 100;
                    if (isFullPage) qrSize = 160;
                    if (isA7) qrSize = 75;
                    
                    new QRCode(el, {
                        text: url,
                        width: qrSize, height: qrSize,
                        correctLevel: QRCode.CorrectLevel.H
                    });
                });
            }, 100);
        }

        function getConsolidatedHTML(qrId) {
            return `
            <div class="flyer-card front print-card">
                <div class="collage-grid" style="height: 70mm;">
                    <div class="collage-item"><img src="assets/premium_sushi_1.webp" loading="lazy" width="640" height="640"></div>
                    <div class="collage-item"><img src="assets/premium_sashimi.webp" loading="lazy" width="640" height="640"></div>
                    <div class="collage-item"><img src="assets/premium_rolls.webp" loading="lazy" width="640" height="640"></div>
                    <div class="collage-item"><img src="assets/close-up-sushi-served-table 1.webp" loading="lazy" width="1920" height="1920"></div>
                    <div class="badge-center" style="width: 28mm; height: 28mm;">
                        <div class="badge-pct" style="font-size: 28pt;">10<span>%</span></div>
                        <div class="badge-txt" style="font-size: 8pt;">NACHLASS</div>
                    </div>
                </div>
                <div class="front-content" style="padding: 4mm 6mm;">
                    <div class="logo-box" style="width: 11mm; height: 11mm; top: -5.5mm;"><img src="assets/logo.png" loading="lazy" width="256" height="256"></div>
                    <div style="height: 4mm;" class="v-spacer"></div>
                    <div class="premium-label" style="font-size: 10pt; margin: 0 0 1mm;">Authentic Japanese Restaurant</div>
                    <div class="discount-banner" style="font-size: 16pt; margin-bottom: 3mm;">Leo Sushi Rabatt</div>
                    
                    <div style="display: flex; align-items: center; gap: 4mm; width: 100%;" class="qr-steps-row">
                        <div class="qr-frame" style="padding: 2mm; flex-shrink: 0; background: #fff;">
                            <div class="qr-placeholder" id="${qrId}" style="width: 22mm; height: 22mm;"></div>
                        </div>
                        <div style="text-align: left; flex: 1;">
                            <div class="step-item" style="margin-bottom: 2mm;">
                                <div class="step-num" style="width: 16px; height: 16px; font-size: 8px;">1</div>
                                <div class="step-txt" style="font-size: 8.5pt;">QR scannen & Shop öffnen.</div>
                            </div>
                            <div class="step-item" style="margin-bottom: 2mm;">
                                <div class="step-num" style="width: 16px; height: 16px; font-size: 8px;">2</div>
                                <div class="step-txt" style="font-size: 8.5pt;">Bestellen & 10% Rabatt erhalten.</div>
                            </div>
                            <div style="font-size: 7.5pt; color: var(--accent-gold); font-weight: 700; margin-top: 1mm;">Gilt für Online-Erstbestellung</div>
                        </div>
                    </div>
                    
                    <div class="front-divider" style="margin: 3mm 0;"></div>
                    <div class="front-footer" style="font-size: 7.5pt; gap: 4mm; letter-spacing: 0.5px;">
                        <span>App & Web Desktop</span> <span>•</span> <span>Lieferservice</span>
                    </div>
                </div>
            </div>`;
        }

        function printFlyers() {
            updateDesign();
            setTimeout(() => window.print(), 800);
        }

        async function downloadImages() {
            const opt = { scale: 3, useCORS: true, backgroundColor: '#0d0d0d' };
            const frontCanvas = await html2canvas(document.getElementById('previewFront'), opt);
            const linkFront = document.createElement('a');
            linkFront.download = 'Leo-Sushi-Premium-Flyer.png';
            linkFront.href = frontCanvas.toDataURL();
            linkFront.click();
        }

        window.onload = updateDesign;
    </script>
</body>
</html>
