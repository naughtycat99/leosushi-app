<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>LEO SUSHI - Script Verification</title>
    <style>
        body { font-family: sans-serif; background: #0a0a0b; color: #fff; padding: 20px; }
        .result { padding: 10px; margin: 5px 0; border-radius: 4px; }
        .success { background: rgba(34, 197, 94, 0.2); border: 1px solid #22c55e; color: #4ade80; }
        .error { background: rgba(239, 68, 68, 0.2); border: 1px solid #ef4444; color: #f87171; }
        .loading { background: rgba(255, 255, 255, 0.1); border: 1px solid #fff; }
    </style>
</head>
<body>
    <h1>LEO SUSHI - Script Verification</h1>
    <div id="results"></div>

    <script>
        const scripts = [
            'js/config.js',
            'js/api.v2.js',
            'js/utils.js',
            'api/index.php?route=v1/data/orders'
        ];

        const resultsDiv = document.getElementById('results');

        async function verify() {
            for (const src of scripts) {
                const div = document.createElement('div');
                div.className = 'result loading';
                div.textContent = `Checking ${src}...`;
                resultsDiv.appendChild(div);

                try {
                    const response = await fetch(src, { method: 'GET', cache: 'no-cache' });
                    if (response.ok) {
                        div.className = 'result success';
                        div.textContent = `✅ ${src} - Loaded successfully (${response.status} ${response.statusText})`;
                    } else {
                        div.className = 'result error';
                        div.textContent = `❌ ${src} - FAILED (${response.status} ${response.statusText})`;
                    }
                } catch (e) {
                    div.className = 'result error';
                    div.textContent = `❌ ${src} - ERROR: ${e.message}`;
                }
            }
        }

        verify();
    </script>
</body>
</html>
